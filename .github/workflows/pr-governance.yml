name: PR Governance

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-governance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  governance:
    name: PR Governance
    # pull_request_target runs trusted base code only. Fork PRs are rejected
    # before checkout; no untrusted source or repository secrets are executed.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject fork PRs before checkout
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Fork PRs are excluded from this privileged pull_request_target workflow."
          echo "Move the change to a reviewed same-repository branch."
          exit 1
      - name: Checkout trusted base governance code
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          clean: true
      - name: Set up Python 3.12
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify GitHub-hosted governance runner
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: bash scripts/check-github-hosted-runner.sh --profile governance
      - name: Validate issue linkage, branch naming and PR evidence sections
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GOVERNANCE_FIRST_PR: "24"
        run: python3.12 scripts/check_pr_governance.py
