name: Founder Admin Stage 2G Production Readiness

on:
  push:
    branches:
      - feature/founder-admin-production-readiness
  pull_request:
    branches:
      - feature/founder-admin-api
    paths:
      - "backend/app/services/production_configuration.py"
      - "backend/tests/test_founder_admin_production_readiness.py"
      - "backend/tests/test_founder_admin_api.py"
      - "backend/.env.modal.example"
      - "docs/FOUNDER_ADMIN_STAGE_2G_PRODUCTION_READINESS.md"
      - ".github/workflows/founder-admin-stage2g-readiness.yml"

permissions:
  contents: read

jobs:
  production-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      DATABASE_BACKEND: sqlite
      DATABASE_PATH: /tmp/stage2g-founder-admin.db
      STORAGE_BACKEND: local
      STORAGE_ROOT: /tmp/stage2g-storage
      JOB_BACKEND: local
      SEED_DEMO_USER: "false"
      GROQ_RANKING_ENABLED: "false"
      ADMIN_API_ENABLED: "false"
      ADMIN_API_SERVICE_TOKEN: ""

    steps:
      - name: Checkout isolated Stage 2G branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile production configuration module
        working-directory: backend
        run: python -m py_compile app/services/production_configuration.py

      - name: Run Founder Admin production boot-gate tests
        working-directory: backend
        run: python -m pytest tests/test_founder_admin_production_readiness.py -v

      - name: Run Founder Admin read-only regression tests
        working-directory: backend
        run: python -m pytest tests/test_founder_admin_api.py -v

      - name: Verify Admin API stays opt-in in production template
        run: |
          python - <<'PY'
          from pathlib import Path

          template = Path("backend/.env.modal.example").read_text(encoding="utf-8")
          assert "ADMIN_API_ENABLED=false" in template
          assert "ADMIN_API_SERVICE_TOKEN=\n" in template
          assert "ADMIN_API_SERVICE_TOKEN=__" not in template
          print("Founder Admin production template remains disabled and secret-free.")
          PY

      - name: Verify read-only source boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("backend/app/api/founder_admin.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source, filename=str(path))

          database_imports = set()
          forbidden_imports = set()
          route_methods = []
          forbidden_calls = set()

          for node in ast.walk(tree):
              if isinstance(node, ast.ImportFrom):
                  imported = {alias.name for alias in node.names}
                  if node.module == "app.core.database":
                      database_imports.update(imported)
                  if "current_user" in imported or "sync_subscription_if_needed" in imported:
                      forbidden_imports.update(imported & {"current_user", "sync_subscription_if_needed"})
              elif isinstance(node, ast.Call):
                  func = node.func
                  if isinstance(func, ast.Name) and func.id in {
                      "execute", "execute_many", "run_in_transaction", "current_user", "sync_subscription_if_needed"
                  }:
                      forbidden_calls.add(func.id)
              elif isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  for decorator in node.decorator_list:
                      if not isinstance(decorator, ast.Call) or not isinstance(decorator.func, ast.Attribute):
                          continue
                      owner = decorator.func.value
                      if isinstance(owner, ast.Name) and owner.id == "router":
                          route_methods.append(decorator.func.attr.lower())

          assert database_imports == {"fetch_all", "fetch_one"}, database_imports
          assert not forbidden_imports, forbidden_imports
          assert not forbidden_calls, forbidden_calls
          assert route_methods.count("get") == 9, route_methods
          assert not ({"post", "put", "patch", "delete"} & set(route_methods)), route_methods
          print("Founder Admin AST confirms nine GET-only routes and fetch-only database access.")
          PY
