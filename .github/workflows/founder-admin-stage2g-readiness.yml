name: Founder Admin Stage 2G Production Readiness

on:
  push:
    branches:
      - feature/founder-admin-production-readiness
  pull_request:
    branches:
      - feature/founder-admin-api
    paths:
      - "backend/app/services/production_configuration.py"
      - "backend/tests/test_founder_admin_production_readiness.py"
      - "backend/tests/test_founder_admin_api.py"
      - "backend/.env.modal.example"
      - "docs/FOUNDER_ADMIN_STAGE_2G_PRODUCTION_READINESS.md"
      - ".github/workflows/founder-admin-stage2g-readiness.yml"

permissions:
  contents: read

jobs:
  production-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      DATABASE_BACKEND: sqlite
      DATABASE_PATH: /tmp/stage2g-founder-admin.db
      STORAGE_BACKEND: local
      STORAGE_ROOT: /tmp/stage2g-storage
      JOB_BACKEND: local
      SEED_DEMO_USER: "false"
      GROQ_RANKING_ENABLED: "false"
      ADMIN_API_ENABLED: "false"
      ADMIN_API_SERVICE_TOKEN: ""

    steps:
      - name: Checkout isolated Stage 2G branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile production configuration module
        working-directory: backend
        run: python -m py_compile app/services/production_configuration.py

      - name: Run Founder Admin production boot-gate tests
        working-directory: backend
        run: python -m pytest tests/test_founder_admin_production_readiness.py -v

      - name: Run Founder Admin read-only regression tests
        working-directory: backend
        run: python -m pytest tests/test_founder_admin_api.py -v

      - name: Verify Admin API stays opt-in in production template
        run: |
          python - <<'PY'
          from pathlib import Path

          template = Path("backend/.env.modal.example").read_text(encoding="utf-8")
          assert "ADMIN_API_ENABLED=false" in template
          assert "ADMIN_API_SERVICE_TOKEN=\n" in template
          assert "ADMIN_API_SERVICE_TOKEN=__" not in template
          print("Founder Admin production template remains disabled and secret-free.")
          PY

      - name: Verify read-only source boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("backend/app/api/founder_admin.py").read_text(encoding="utf-8")
          forbidden = ("execute(", "execute_many(", "run_in_transaction(", "current_user", "sync_subscription_if_needed")
          for marker in forbidden:
              assert marker not in source, marker
          assert source.count('@router.get(') == 9
          for method in ("post", "put", "patch", "delete"):
              assert f'@router.{method}(' not in source
          print("Founder Admin source remains nine-route GET-only and database-read-only.")
          PY
