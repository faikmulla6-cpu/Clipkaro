name: Founder Admin Stage 2J Cloud Gate

on:
  pull_request:
    branches:
      - feature/founder-admin-api
    paths:
      - "backend/app/api/founder_admin.py"
      - "backend/app/services/production_configuration.py"
      - "backend/tests/test_founder_admin_api.py"
      - "backend/tests/test_founder_admin_production_readiness.py"
      - "backend/scripts/verify_stage2j_activation_prep.py"
      - "backend/release/founder-admin-stage2j.json"
      - "backend/.env.example"
      - "backend/.env.modal.example"
      - "docs/FOUNDER_ADMIN_STAGE_2J_ACTIVATION.md"
      - ".github/workflows/founder-admin-stage2j-cloud-gate.yml"

permissions:
  contents: read

concurrency:
  group: founder-admin-stage2j-cloud-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cloud-gate:
    name: Stage 2J Cloud Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: test
      DATABASE_BACKEND: sqlite
      STORAGE_BACKEND: local
      JOB_BACKEND: local
      TRANSCRIPTION_BACKEND: fixture
      GROQ_RANKING_ENABLED: "false"
      ADMIN_API_ENABLED: "false"
      ADMIN_API_SERVICE_TOKEN: ""

    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12 with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Set up Node.js 22 with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Stage 2J fail-closed preparation
        run: python backend/scripts/verify_stage2j_activation_prep.py

      - name: Install backend test dependencies once
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run focused production and critical backend regressions
        working-directory: backend
        env:
          PYTHONPATH: .
        run: >-
          pytest -q
          tests/test_founder_admin_api.py
          tests/test_founder_admin_production_readiness.py
          tests/test_production_preflight.py
          tests/test_production_configuration.py
          tests/test_security_foundation.py
          tests/test_subscription_lifecycle.py
          tests/test_email_verification.py
          tests/test_legal_privacy.py
          tests/test_main_protection_contract.py
          tests/test_self_hosted_runner_contract.py
          tests/test_fresh_launch_certification_contract.py

      - name: Install locked frontend dependencies once
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run critical frontend contracts
        working-directory: frontend
        run: |
          npm run check:settings-trust
          npm run check:analytics-truth
          npm run check:billing-lifecycle
          npm run check:email-verification
          npm run check:security-foundation
          npm run check:legal-privacy
          npm run check:release-identity

      - name: Build production frontend once
        working-directory: frontend
        run: npm run build

      - name: Validate production Compose without building images
        env:
          DOMAIN: clipkaro.example
          ACME_EMAIL: ci@example.com
          SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
        run: docker compose -f docker-compose.hostinger.yml config --quiet

      - name: Confirm committed production gates remain disabled and secret-free
        shell: bash
        run: |
          grep -qx 'ADMIN_API_ENABLED=false' backend/.env.modal.example
          grep -qx 'ADMIN_API_SERVICE_TOKEN=' backend/.env.modal.example
          ! grep -Eq '^ADMIN_API_SERVICE_TOKEN=.{1,}$' backend/.env.modal.example
          ! grep -R --line-number --exclude='*.md' --exclude='*.yml' --exclude='*.yaml' 'ADMIN_API_ENABLED=true' backend .github || false
          echo 'Stage 2J cloud gate completed without Docker image builds or media/ASR stress jobs.'
