name: Smart Layout v2 isolated contract checks

on:
  push:
    branches:
      - work/secure-smart-layout-v2-20261018
  pull_request:
    branches:
      - feature/creator-pulse-next-move
      - work/secure-smart-layout-v2-20261018

permissions:
  contents: read

jobs:
  layout-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify strict Python contract without cloud credentials
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -p test_smart_layout_contract_v2.py -v
      - name: Verify middle-strip caption geometry with real FFmpeg
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -p test_smart_layout_caption_board.py -v
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify browser geometry without dependencies or media access
        run: node frontend/scripts/check-smart-layout-v2.mjs
      - name: Verify top-up consent and captured-payment source contracts
        run: node frontend/scripts/check-credit-topups.mjs

  layout-quality-regression:
    name: Smart Layout live-speaker and camera-cut tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without GitHub write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and FFprobe for actual export validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Install local-only vision test dependencies
        run: python -m pip install numpy==2.1.3 opencv-python-headless==4.11.0.86
      - name: Verify real-face and scene-cut quality gates
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -p test_karo_smart_layouts.py -v
      - name: Verify real FFmpeg and cached-preview export geometry
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -p test_smart_layout_v2_integration.py -v

  topup-payment-regression:
    name: Karo top-up payment and legal acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: clipkaro
          POSTGRES_PASSWORD: clipkaro_ci_only
          POSTGRES_DB: clipkaro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U clipkaro -d clipkaro_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout source without saved credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install isolated backend test dependencies
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Verify legal consent and exact-once Karo credit payments
        working-directory: backend
        env:
          APP_ENV: test
          TRANSCRIPTION_BACKEND: fixture
          PYTHONPATH: .
          POSTGRES_TEST_URL: postgresql://clipkaro:clipkaro_ci_only@127.0.0.1:5432/clipkaro_test
        run: pytest -q tests/test_credit_topup_payments.py tests/test_credit_topup_postgres_exact_once.py
      - name: Verify Smart Layout private cache and ownership security
        working-directory: backend
        env:
          APP_ENV: test
          PYTHONPATH: .
        run: pytest -q tests/test_smart_layout_v2_security.py
