name: Critical Product Contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: critical-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-critical:
    name: Critical Backend Invariants
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install FFmpeg on ephemeral Ubuntu runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Run static release verifier
        run: python scripts/verify-release-static.py
      - name: Create isolated backend virtualenv
        working-directory: backend
        run: |
          rm -rf .venv-ci
          python -m venv .venv-ci
          echo "$PWD/.venv-ci/bin" >> "$GITHUB_PATH"
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Run money, quota, auth, legal, runner and database invariants
        working-directory: backend
        env:
          APP_ENV: test
          TRANSCRIPTION_BACKEND: fixture
          PYTHONPATH: .
        run: >-
          pytest -q
          tests/test_api.py
          tests/test_subscription_lifecycle.py
          tests/test_sqlite_concurrency.py
          tests/test_email_verification.py
          tests/test_security_foundation.py
          tests/test_production_preflight.py
          tests/test_production_configuration.py
          tests/test_main_protection_contract.py
          tests/test_legal_privacy.py
          tests/test_production_alignment.py
          tests/test_self_hosted_runner_contract.py
          tests/test_asr_qualification_contract.py
          tests/test_landscape_qualification_contract.py
          tests/test_fresh_launch_certification_contract.py
      - name: Clean backend job workspace
        if: always()
        run: rm -rf backend/.venv-ci backend/.pytest_cache backend/**/__pycache__

  frontend-critical:
    name: Critical Frontend Contracts
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Billing lifecycle UI contract
        working-directory: frontend
        run: npm run check:billing-lifecycle
      - name: Email verification contract
        working-directory: frontend
        run: npm run check:email-verification
      - name: Security foundation contract
        working-directory: frontend
        run: npm run check:security-foundation
      - name: Legal and privacy paid-launch contract
        working-directory: frontend
        run: npm run check:legal-privacy
      - name: Check frontend build hygiene contract
        working-directory: frontend
        run: npm run check:build-hygiene
      - name: Clean frontend job workspace
        if: always()
        run: rm -rf frontend/node_modules frontend/.next
