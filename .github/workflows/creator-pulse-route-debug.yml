name: Creator Pulse Route Debug

on:
  pull_request:
    branches: [modal-no-vps]

permissions:
  contents: read

jobs:
  route-debug:
    if: github.event.pull_request.head.ref == 'feature/creator-pulse-write-actual'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-pulse-write-actual
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Patch only Creator Pulse main registration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/app/main.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'from app.api.cloud_uploads import init_cloud_uploads, router as cloud_uploads_router\n',
              'from app.api.cloud_uploads import init_cloud_uploads, router as cloud_uploads_router\nfrom app.api.creator_pulse import init_creator_pulse, router as creator_pulse_router\n',
              1,
          )
          text = text.replace(
              'app.include_router(cloud_uploads_router, prefix=settings.api_prefix)\napp.include_router(router, prefix=settings.api_prefix)\n',
              'app.include_router(cloud_uploads_router, prefix=settings.api_prefix)\napp.include_router(creator_pulse_router, prefix=settings.api_prefix)\napp.include_router(router, prefix=settings.api_prefix)\n',
              1,
          )
          p.write_text(text, encoding='utf-8')
          PY
      - name: Prove imported modules and registered routes
        env:
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          import app.main as main_module
          import app.api.creator_pulse as pulse_module
          from app.core.config import get_settings
          print('MAIN_FILE=', main_module.__file__)
          print('PULSE_FILE=', pulse_module.__file__)
          print('API_PREFIX=', get_settings().api_prefix)
          pulse_paths = sorted(getattr(route, 'path', '') for route in pulse_module.router.routes)
          app_paths = sorted(getattr(route, 'path', '') for route in main_module.app.routes)
          print('PULSE_ROUTE_COUNT=', len(pulse_paths))
          print('PULSE_PATHS=', pulse_paths)
          print('APP_ROUTE_COUNT=', len(app_paths))
          print('CREATOR_PULSE_APP_PATHS=', [path for path in app_paths if 'creator-pulse' in path])
          required = {
              '/api/v1/creator-pulse/status',
              '/api/v1/creator-pulse/analyse',
              '/api/v1/creator-pulse/balance/checkout',
              '/api/v1/creator-pulse/balance/verify',
          }
          missing = required - set(app_paths)
          if missing:
              raise SystemExit(f'Missing app routes after main-only registration: {sorted(missing)}')
          PY
