name: Creator Pulse Route Debug

on:
  pull_request:
    branches: [modal-no-vps]

permissions:
  contents: read

jobs:
  runtime-include:
    if: github.event.pull_request.head.ref == 'feature/creator-pulse-write-actual'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-pulse-write-actual
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Patch main registration with strict guards
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/app/main.py')
          text = p.read_text(encoding='utf-8')
          ia = 'from app.api.cloud_uploads import init_cloud_uploads, router as cloud_uploads_router\n'
          inc = 'app.include_router(cloud_uploads_router, prefix=settings.api_prefix)\napp.include_router(router, prefix=settings.api_prefix)\n'
          if ia not in text or inc not in text:
              raise SystemExit('main anchors missing')
          text = text.replace(ia, ia + 'from app.api.creator_pulse import init_creator_pulse, router as creator_pulse_router\n', 1)
          text = text.replace(inc, 'app.include_router(cloud_uploads_router, prefix=settings.api_prefix)\napp.include_router(creator_pulse_router, prefix=settings.api_prefix)\napp.include_router(router, prefix=settings.api_prefix)\n', 1)
          p.write_text(text, encoding='utf-8')
          lines = p.read_text(encoding='utf-8').splitlines()
          for number, line in enumerate(lines, 1):
              if 'creator_pulse' in line:
                  print(f'SOURCE_{number}={line}')
          PY
      - name: Prove runtime include behavior
        env:
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          import app.main as main_module
          import app.api.creator_pulse as pulse_module
          print('MAIN_HAS_ROUTER_SYMBOL=', hasattr(main_module, 'creator_pulse_router'))
          if hasattr(main_module, 'creator_pulse_router'):
              print('SAME_ROUTER_OBJECT=', main_module.creator_pulse_router is pulse_module.router)
          before = sorted(getattr(route, 'path', '') for route in main_module.app.routes)
          print('BEFORE_COUNT=', len(before))
          print('BEFORE_PULSE=', [p for p in before if 'creator-pulse' in p])
          main_module.app.include_router(pulse_module.router, prefix='/api/v1')
          after = sorted(getattr(route, 'path', '') for route in main_module.app.routes)
          print('AFTER_COUNT=', len(after))
          print('AFTER_PULSE=', [p for p in after if 'creator-pulse' in p])
          required = {
              '/api/v1/creator-pulse/status',
              '/api/v1/creator-pulse/analyse',
              '/api/v1/creator-pulse/balance/checkout',
              '/api/v1/creator-pulse/balance/verify',
          }
          if not required.issubset(set(after)):
              raise SystemExit('Direct runtime include also failed')
          PY
