name: Prepare Next Security Patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate exact patched lockfile
        working-directory: frontend
        run: npm install next@16.3.4 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exact patched dependency graph
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Verify patched production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Generate canonical Next production type environment
        working-directory: frontend
        env:
          BACKEND_URL: https://ci-backend.invalid
        run: npm run build

      - name: Add hosted-runner disk reclamation without lowering qualification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/fresh-launch-qa.yml')
          text = path.read_text(encoding='utf-8')
          marker = "      - name: Verify exact clean checkout\n"
          block = (
              "      - name: Reclaim GitHub-hosted runner disk for production qualification\n"
              "        shell: bash\n"
              "        run: |\n"
              "          echo \"Disk before safe cleanup:\"\n"
              "          df -h /\n"
              "          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup\n"
              "          sudo apt-get clean\n"
              "          docker system prune -af --volumes || true\n"
              "          echo \"Disk after safe cleanup:\"\n"
              "          df -h /\n"
              "\n"
          )
          if 'Reclaim GitHub-hosted runner disk for production qualification' in text:
              raise SystemExit('cleanup block already present unexpectedly')
          if text.count(marker) != 1:
              raise SystemExit('Fresh Launch insertion marker is not unique')
          path.write_text(text.replace(marker, block + marker, 1), encoding='utf-8')
          PY

      - name: Remove temporary generator and verify exact intended diff
        shell: bash
        run: |
          git rm -- .github/workflows/prepare-next-security-patch.yml
          git diff --check
          actual="$( { git diff --name-only; git diff --cached --name-only; } | sort -u)"
          expected="$(printf '%s\n' \
            '.github/workflows/fresh-launch-qa.yml' \
            '.github/workflows/prepare-next-security-patch.yml' \
            'frontend/next-env.d.ts' \
            'frontend/package-lock.json' \
            'frontend/package.json' | sort)"
          printf 'Intended diff:\n%s\n' "$actual"
          test "$actual" = "$expected"
          grep -F '"next": "16.3.4"' frontend/package.json
          grep -F '"next": "16.3.4"' frontend/package-lock.json
          grep -F 'import "./.next/types/routes.d.ts";' frontend/next-env.d.ts
          grep -F 'at least 25 GiB free disk required' scripts/check_fresh_launch_execution_environment.py

      - name: Commit exact safe repair to validation branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/fresh-launch-qa.yml frontend/package.json frontend/package-lock.json frontend/next-env.d.ts
          git status --short
          git commit -m 'ci: resolve hosted Fresh Launch blockers safely'
          git push origin HEAD:fix/founder-admin-current-production
