name: Prepare Next Security Patch

on:
  push:
    branches: [fix/founder-admin-current-production]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate exact patched lockfile
        working-directory: frontend
        run: npm install next@16.3.4 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exact patched dependency graph
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Verify patched production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Generate canonical Next production type environment
        working-directory: frontend
        env:
          BACKEND_URL: https://ci-backend.invalid
        run: npm run build

      - name: Upload exact generated patch files
        uses: actions/upload-artifact@v4
        with:
          name: next-security-patch-${{ github.run_id }}
          path: |
            frontend/package.json
            frontend/package-lock.json
            frontend/next-env.d.ts
          if-no-files-found: error
          retention-days: 1
