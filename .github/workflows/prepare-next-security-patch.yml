name: Prepare Next Security Patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check whether repair is already staged
        id: state
        shell: bash
        run: |
          if test -f ci-generated/fresh-launch-qa.yml; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Proven repair is already staged; no write required."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node 20
        if: steps.state.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate exact patched lockfile
        if: steps.state.outputs.needed == 'true'
        working-directory: frontend
        run: npm install next@16.3.4 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exact patched dependency graph
        if: steps.state.outputs.needed == 'true'
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Verify patched production dependency audit
        if: steps.state.outputs.needed == 'true'
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Generate canonical Next production type environment
        if: steps.state.outputs.needed == 'true'
        working-directory: frontend
        env:
          BACKEND_URL: https://ci-backend.invalid
        run: npm run build

      - name: Stage reviewed Fresh Launch workflow outside workflows directory
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          mkdir -p ci-generated
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/fresh-launch-qa.yml')
          target = Path('ci-generated/fresh-launch-qa.yml')
          text = source.read_text(encoding='utf-8')
          marker = "      - name: Verify exact clean checkout\n"
          block = (
              "      - name: Reclaim GitHub-hosted runner disk for production qualification\n"
              "        shell: bash\n"
              "        run: |\n"
              "          echo \"Disk before safe cleanup:\"\n"
              "          df -h /\n"
              "          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup\n"
              "          sudo apt-get clean\n"
              "          docker system prune -af --volumes || true\n"
              "          echo \"Disk after safe cleanup:\"\n"
              "          df -h /\n"
              "\n"
          )
          if 'Reclaim GitHub-hosted runner disk for production qualification' in text:
              raise SystemExit('cleanup block already present unexpectedly')
          if text.count(marker) != 1:
              raise SystemExit('Fresh Launch insertion marker is not unique')
          target.write_text(text.replace(marker, block + marker, 1), encoding='utf-8')
          PY

      - name: Verify exact staged repair diff
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          git diff --check
          actual="$( { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)"
          expected="$(printf '%s\n' \
            'ci-generated/fresh-launch-qa.yml' \
            'frontend/next-env.d.ts' \
            'frontend/package-lock.json' \
            'frontend/package.json' | sort)"
          printf 'Staged repair diff:\n%s\n' "$actual"
          test "$actual" = "$expected"
          grep -F '"next": "16.3.4"' frontend/package.json
          grep -F '"next": "16.3.4"' frontend/package-lock.json
          grep -F 'import "./.next/types/routes.d.ts";' frontend/next-env.d.ts
          grep -F 'Reclaim GitHub-hosted runner disk for production qualification' ci-generated/fresh-launch-qa.yml
          grep -F 'at least 25 GiB free disk required' scripts/check_fresh_launch_execution_environment.py

      - name: Commit only non-workflow staged repair files
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-generated/fresh-launch-qa.yml frontend/package.json frontend/package-lock.json frontend/next-env.d.ts
          git status --short
          git commit -m 'ci: stage proven Fresh Launch repair artifacts'
          git push origin HEAD:fix/founder-admin-current-production
