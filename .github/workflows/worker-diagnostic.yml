name: Temporary Worker Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  worker-diagnostic:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          clean: true

      - name: Reclaim hosted-runner disk
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          docker system prune -af --volumes || true
          df -h /

      - name: Capture worker image build
        id: worker_build
        shell: bash
        run: |
          set +e
          mkdir -p worker-diagnostic
          docker build --progress=plain --pull --target worker -t clipkaro-worker:diag-${GITHUB_RUN_ID} backend 2>&1 | tee worker-diagnostic/worker-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$status" > worker-diagnostic/worker-build-status.txt
          exit 0

      - name: Capture WhisperX runtime when image exists
        if: steps.worker_build.outputs.status == '0'
        shell: bash
        run: |
          set +e
          docker run --rm --entrypoint python clipkaro-worker:diag-${GITHUB_RUN_ID} -c "from app.services.forced_alignment import validate_forced_alignment_runtime; print(validate_forced_alignment_runtime('whisperx', True, enforce_production_policy=True, enforce_pinned_versions=True))" 2>&1 | tee worker-diagnostic/whisperx-runtime.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > worker-diagnostic/whisperx-runtime-status.txt
          exit 0

      - name: Record Docker state
        if: always()
        shell: bash
        run: |
          docker image ls --no-trunc > worker-diagnostic/docker-images.txt 2>&1 || true
          df -h / > worker-diagnostic/disk-after.txt 2>&1 || true

      - name: Upload worker diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-diagnostic-${{ github.run_id }}
          path: worker-diagnostic/
          if-no-files-found: error
          retention-days: 7
