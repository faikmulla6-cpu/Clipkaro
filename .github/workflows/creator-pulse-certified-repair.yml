name: Creator Pulse Certified Repair

on:
  pull_request:
    branches: [modal-no-vps]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feature/creator-pulse-write-actual'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CERTIFIED_SHA: 300493e98be1b040e5912dea5f2b02111f8d618d
      BACKEND_URL: https://clipkaro-ci.invalid
    steps:
      - name: Checkout Creator Pulse branch
        uses: actions/checkout@v4
        with:
          ref: feature/creator-pulse-write-actual
          fetch-depth: 0

      - name: Verify certified source commit
        shell: bash
        run: |
          git cat-file -e "${CERTIFIED_SHA}^{commit}"
          echo "Using previously LAUNCH-CERTIFIED source: ${CERTIFIED_SHA}"

      - name: Restore only six proven certification repairs
        shell: bash
        run: |
          set -euo pipefail
          files=(
            backend/Dockerfile
            backend/tests/test_fresh_launch_certification_contract.py
            frontend/next-env.d.ts
            frontend/package.json
            frontend/package-lock.json
            scripts/generate_launch_qa_report.py
          )
          for path in "${files[@]}"; do
            git show "${CERTIFIED_SHA}:${path}" > "$path"
          done
          printf '%s\n' "${files[@]}" | sort > /tmp/expected-repair-files.txt
          git diff --name-only | sort > /tmp/actual-repair-files.txt
          diff -u /tmp/expected-repair-files.txt /tmp/actual-repair-files.txt
          sha256sum frontend/next-env.d.ts > /tmp/next-env-certified.sha256

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Ubuntu validation tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg faketime

      - name: Reclaim runner disk for worker qualification
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          sudo apt-get clean
          docker system prune -af --volumes || true
          df -h /

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Verify Creator Pulse and certification contracts
        working-directory: backend
        env:
          APP_ENV: test
          TRANSCRIPTION_BACKEND: fixture
          PYTHONPATH: .
        run: >-
          pytest -q
          tests/test_creator_pulse.py
          tests/test_fresh_launch_certification_contract.py

      - name: Compile affected Python surfaces
        run: python -m compileall -q backend/app backend/tests/test_creator_pulse.py backend/tests/test_fresh_launch_certification_contract.py scripts/generate_launch_qa_report.py

      - name: Install exact frontend lockfile
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Enforce production dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend release contracts
        working-directory: frontend
        run: npm run check:release

      - name: Production Next.js build
        working-directory: frontend
        run: npm run build

      - name: Prove Next generated declaration is stable
        shell: bash
        run: sha256sum -c /tmp/next-env-certified.sha256

      - name: Build production worker image
        run: docker build --pull --target worker -t clipkaro-worker:certified-repair-${GITHUB_RUN_ID} backend

      - name: Validate production worker WhisperX runtime
        run: >-
          docker run --rm --entrypoint python
          clipkaro-worker:certified-repair-${GITHUB_RUN_ID}
          -c "from app.services.forced_alignment import validate_forced_alignment_runtime; print(validate_forced_alignment_runtime('whisperx', True, enforce_production_policy=True, enforce_pinned_versions=True))"

      - name: Restore generated TypeScript cache
        if: always()
        shell: bash
        run: git checkout -- frontend/tsconfig.tsbuildinfo 2>/dev/null || true

      - name: Guard repair diff
        shell: bash
        run: |
          git diff --name-only | sort > /tmp/final-repair-files.txt
          diff -u /tmp/expected-repair-files.txt /tmp/final-repair-files.txt
          git diff --check

      - name: Commit verified six-file repair
        shell: bash
        run: |
          git config user.name "ClipKaro CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            backend/Dockerfile \
            backend/tests/test_fresh_launch_certification_contract.py \
            frontend/next-env.d.ts \
            frontend/package.json \
            frontend/package-lock.json \
            scripts/generate_launch_qa_report.py
          git commit -m "fix: restore certified launch qualification repairs"
          git push origin HEAD:feature/creator-pulse-write-actual

      - name: Clean worker image
        if: always()
        run: docker image rm -f clipkaro-worker:certified-repair-${GITHUB_RUN_ID} >/dev/null 2>&1 || true
