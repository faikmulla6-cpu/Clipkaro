name: Temporary Launch Certification Marker Repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  guarded-repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/founder-admin-current-production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          clean: true

      - name: Detect whether exact repair is already present
        id: state
        shell: bash
        run: |
          if grep -F '"launch_certification": "LAUNCH-CERTIFIED" if decision == "CERTIFIED" else f"LAUNCH-{decision}"' scripts/generate_launch_qa_report.py \
             && grep -F 'workflow = {"run_id": "123", "repository": "faikmulla6-cpu/Clipkaro"}' backend/tests/test_fresh_launch_certification_contract.py \
             && grep -F 'assert "runs-on: ubuntu-latest" in workflow' backend/tests/test_fresh_launch_certification_contract.py; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply exact launch-certification evidence repair
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          report_path = Path('scripts/generate_launch_qa_report.py')
          source = report_path.read_text(encoding='utf-8')
          replacements = [
              (
                  '    status = "CERTIFIED ✅" if report["certified"] else f"{report[\'decision\']} ❌"',
                  '    status = "LAUNCH-CERTIFIED ✅" if report["certified"] else f"LAUNCH-{report[\'decision\']} ❌"',
              ),
              (
                  '        "certified": decision == "CERTIFIED",\n        "decision": decision,',
                  '        "certified": decision == "CERTIFIED",\n        "decision": decision,\n        "launch_certification": "LAUNCH-CERTIFIED" if decision == "CERTIFIED" else f"LAUNCH-{decision}",',
              ),
              (
                  '    if payload.get("certified") is True and payload.get("decision") == "CERTIFIED" and all(checks.get(name) == "success" for name in MANDATORY_CHECKS):',
                  '    if (\n        payload.get("certified") is True\n        and payload.get("decision") == "CERTIFIED"\n        and payload.get("launch_certification") == "LAUNCH-CERTIFIED"\n        and all(checks.get(name) == "success" for name in MANDATORY_CHECKS)\n    ):',
              ),
              (
                  '        print(f"Fresh Launch QA certified {payload.get(\'release_version\')} at {payload.get(\'identity\', {}).get(\'tested_sha\')}")',
                  '        print(f"Fresh Launch QA LAUNCH-CERTIFIED {payload.get(\'release_version\')} at {payload.get(\'identity\', {}).get(\'tested_sha\')}")',
              ),
              (
                  'A tracked source file is intentionally not rewritten to say CERTIFIED after the run, because doing so would create a new Git SHA that was not the SHA tested.',
                  'A tracked source file is intentionally not rewritten to say LAUNCH-CERTIFIED after the run, because doing so would create a new Git SHA that was not the SHA tested.',
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Unexpected launch report replacement count {count} for: {old[:80]}')
              source = source.replace(old, new, 1)
          report_path.write_text(source, encoding='utf-8')

          test_path = Path('backend/tests/test_fresh_launch_certification_contract.py')
          test_source = test_path.read_text(encoding='utf-8')
          test_replacements = [
              ('workflow = {"run_id": "123", "repository": "faikmulla/ClipkaroAI"}', 'workflow = {"run_id": "123", "repository": "faikmulla6-cpu/Clipkaro"}'),
              ('assert "runs-on: [self-hosted, linux, x64, clipkaro-qa]" in workflow', 'assert "runs-on: ubuntu-latest" in workflow'),
          ]
          for old, new in test_replacements:
              count = test_source.count(old)
              if count != 1:
                  raise SystemExit(f'Unexpected certification test replacement count {count} for: {old}')
              test_source = test_source.replace(old, new, 1)
          test_path.write_text(test_source, encoding='utf-8')
          PY

      - name: Verify exact repair and enforcement contract
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(backend/tests/test_fresh_launch_certification_contract.py scripts/generate_launch_qa_report.py)
          [[ "${changed[*]}" == "${expected[*]}" ]]
          python3 -m py_compile scripts/generate_launch_qa_report.py backend/tests/test_fresh_launch_certification_contract.py
          ! grep -F 'faikmulla/ClipkaroAI' backend/tests/test_fresh_launch_certification_contract.py
          grep -F 'faikmulla6-cpu/Clipkaro' backend/tests/test_fresh_launch_certification_contract.py
          grep -F 'LAUNCH-CERTIFIED' scripts/generate_launch_qa_report.py
          python3 - <<'PY'
          import argparse
          import importlib.util
          import json
          from pathlib import Path

          script = Path('scripts/generate_launch_qa_report.py').resolve()
          spec = importlib.util.spec_from_file_location('clipkaro_launch_qa_marker', script)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)

          checks = {name: 'success' for name in module.MANDATORY_CHECKS}
          payload = {
              'schema': 'clipkaro.launch-qa.v2',
              'release_version': '7.8.0',
              'certified': True,
              'decision': 'CERTIFIED',
              'launch_certification': 'LAUNCH-CERTIFIED',
              'checks': checks,
              'identity': {'tested_sha': '0' * 40},
              'blockers': [],
              'failures': [],
          }
          payload['evidence_sha256'] = module._canonical_digest(payload)
          probe = Path('launch-marker-probe.json')
          probe.write_text(json.dumps(payload), encoding='utf-8')
          try:
              assert module.enforce(argparse.Namespace(report=str(probe))) == 0
          finally:
              probe.unlink(missing_ok=True)

          render_payload = {
              **payload,
              'workflow': {'run_id': '123'},
              'generated_at_utc': '2026-09-01T00:00:00+00:00',
              'backend_tests': {'tests': 200, 'failures': 0, 'errors': 0},
              'npm_production_audit': {'high': 0, 'critical': 0},
          }
          rendered = module._render_certification_record(render_payload)
          assert '**Status: LAUNCH-CERTIFIED ✅**' in rendered
          PY

      - name: Commit only proven certification repair
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(backend/tests/test_fresh_launch_certification_contract.py scripts/generate_launch_qa_report.py)
          [[ "${changed[*]}" == "${expected[*]}" ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/tests/test_fresh_launch_certification_contract.py scripts/generate_launch_qa_report.py
          mapfile -t staged < <(git diff --cached --name-only | sort)
          [[ "${staged[*]}" == "${expected[*]}" ]]
          git commit -m 'ci: bind LAUNCH-CERTIFIED marker to immutable evidence'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
