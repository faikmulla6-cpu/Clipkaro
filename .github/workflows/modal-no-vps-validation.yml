name: Modal B2 No-VPS Validation

on:
  push:
    branches: [modal-no-vps]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clipkaro-modal-no-vps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-validation:
    name: Modal adapters and PostgreSQL contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: clipkaro
          POSTGRES_PASSWORD: clipkaro_ci_only
          POSTGRES_DB: clipkaro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U clipkaro -d clipkaro_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_BACKEND: postgres
      DATABASE_URL: postgresql://clipkaro:clipkaro_ci_only@127.0.0.1:5432/clipkaro_test
      POSTGRES_TEST_URL: postgresql://clipkaro:clipkaro_ci_only@127.0.0.1:5432/clipkaro_test
      POSTGRES_POOL_MIN_SIZE: 0
      POSTGRES_POOL_MAX_SIZE: 4
      POSTGRES_STATEMENT_CACHE_SIZE: 0
      APP_ENV: test
      TRANSCRIPTION_BACKEND: fixture
      EMAIL_VERIFICATION_REQUIRED: true
      FRONTEND_URL: https://clipkaro.pro
      APP_PUBLIC_URL: https://clipkaro.pro
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m pip check

      - name: Compile Modal and backend sources
        working-directory: backend
        run: python -m compileall -q app modal_app.py

      - name: Apply PostgreSQL migration
        working-directory: backend
        run: alembic upgrade head

      - name: Run PostgreSQL concurrency and auth integration
        working-directory: backend
        run: |
          pytest -q tests/test_postgres_integration.py
          pytest -q tests/test_postgres_auth_flow.py

      - name: Run Modal B2 and production-gate regressions
        working-directory: backend
        run: |
          pytest -q tests/test_modal_no_vps_architecture.py
          pytest -q tests/test_production_configuration.py
          pytest -q tests/test_production_preflight.py

      - name: Test India Quality regressions
        working-directory: backend
        run: pytest -q tests/test_india_quality.py

      - name: Test creator zoom regressions
        working-directory: backend
        run: pytest -q tests/test_zoom_control.py

      - name: Test transcript review regressions
        working-directory: backend
        env:
          DATABASE_BACKEND: sqlite
          DATABASE_URL: ""
        run: pytest -q tests/test_transcript_review.py

      - name: Test Content Pack regressions
        working-directory: backend
        env:
          DATABASE_BACKEND: sqlite
          DATABASE_URL: ""
        run: pytest -q tests/test_content_pack.py

      - name: Test rendering regressions
        working-directory: backend
        run: pytest -q tests/test_rendering.py

      - name: Run preserved no-VPS architecture tests
        working-directory: backend
        run: pytest -q tests/test_no_vps_architecture.py

  frontend-validation:
    name: Hostinger Next.js production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_UPLOAD_MODE: direct_gcs
      BACKEND_URL: https://backend.example.invalid
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Check email verification contract
        working-directory: frontend
        run: npm run check:email-verification

      - name: Check security foundation contract
        working-directory: frontend
        run: npm run check:security-foundation

      - name: Check Creator Studio quality contracts
        working-directory: frontend
        run: npm run check:quality-fixes

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build production frontend
        working-directory: frontend
        run: npm run build
